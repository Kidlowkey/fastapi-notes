services:
  - type: web
    name: demo-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: demo-queue
          property: connectionString

  - type: worker
    name: demo-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    maxShutdownDelaySeconds: 30 # give in-flight jobs time to finish on deploy
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: demo-queue
          property: connectionString

  - type: keyvalue
    name: demo-queue
    plan: free
    ipAllowList: [] # private-network-only access
